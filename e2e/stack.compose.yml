services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by scripts/e2e/up.sh}
      POSTGRES_DB: mastra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    restart: "no"
    environment:
      CLICKHOUSE_DB: mastra
      CLICKHOUSE_USER: mastra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?generated by scripts/e2e/up.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks: [e2e]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s

  model-gateway:
    image: node:22-bookworm-slim
    restart: "no"
    working_dir: /stub
    command: ["node", "/stub/model-gateway.mjs"]
    environment:
      PORT: "8080"
      DEFAULT_DELAY_MS: "500"
    volumes:
      - ./stack/model-gateway.mjs:/stub/model-gateway.mjs:ro
    networks: [e2e]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  agents:
    build:
      context: ./stack
      dockerfile: runtime.Dockerfile
      target: runtime
      additional_contexts:
        agents: ../../EightState Agents Studio
        studio_dist: ../packages/eightstate-studio/dist
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4111"
      MASTRA_SERVICE_NAME: e2e
      MASTRA_DEV: "true"
      MASTRA_HIDE_CLOUD_CTA: "true"
      MASTRA_TELEMETRY_DISABLED: "true"
      MASTRA_STUDIO_HOST: 127.0.0.1
      MASTRA_STUDIO_PROTOCOL: http
      MASTRA_STUDIO_PORT: ${E2E_STUDIO_PORT:-4211}
      MASTRA_API_KEYS: ${E2E_API_KEY:?generated by scripts/e2e/up.sh}
      MASTRA_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-e2e@example.invalid}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: mastra
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?generated by scripts/e2e/up.sh}
      DATABASE_NAME: mastra
      CLICKHOUSE_URL: http://clickhouse:8123/mastra
      CLICKHOUSE_USERNAME: mastra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?generated by scripts/e2e/up.sh}
      EIGHTSTATE_BASE_URL: http://model-gateway:8080/v1
      EIGHTSTATE_API_KEY: e2e-local-model-key
      EIGHTSTATE_DEFAULT_MODEL: e2e-deterministic-model
      REASONING_EFFORT: none
      MAX_COMPLETION_TOKENS: "1024"
      EIGHTSTATE_GATE_URL: http://model-gateway:8080
      EIGHTSTATE_GATE_TOKEN: e2e-local-research-token
    networks: [e2e]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4111/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  edge:
    image: nginx:1.29.4-alpine
    restart: "no"
    depends_on:
      agents:
        condition: service_healthy
    volumes:
      - ./stack/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${E2E_STUDIO_PORT:-4211}:8080"
    networks: [e2e, edge-host]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readiness"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:

networks:
  e2e:
    internal: true
  edge-host:
    internal: false
